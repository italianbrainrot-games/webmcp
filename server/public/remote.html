<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SaaS 手机遥控器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
  <div class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-lg font-bold">WebMCP 遥控器</h1>
    <div id="status" class="text-xs bg-yellow-500 px-2 py-1 rounded">连接中...</div>
  </div>
  
  <div class="bg-gray-200 text-gray-500 text-[10px] px-4 py-1 flex justify-between">
    <span>Session: <span id="sessionDisplay">--</span></span>
  </div>

  <script>
    // 提取 SessionID 并在页面上显示（优先执行）
    window.urlParams = new URLSearchParams(window.location.search);
    window.sessionId = window.urlParams.get('sessionId');
    if (window.sessionId) {
      document.getElementById('sessionDisplay').textContent = window.sessionId;
    } else {
      alert("缺少 sessionId，请重新扫码！");
    }
  </script>
  
  <div class="p-3 bg-white border-b shadow-sm text-xs">
    <label class="block font-medium text-gray-700 mb-1">Moonshot (Kimi) API Key</label>
    <input type="password" id="apiKey" class="block w-full rounded border-gray-300 shadow-sm border p-2" placeholder="sk-...">
  </div>

  <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
    <div class="text-center text-gray-400 text-xs">扫码成功！请在下方输入指令控制电脑上的 SaaS 网页。</div>
  </div>

  <div class="p-3 bg-white border-t flex gap-2">
    <input type="text" id="msgInput" class="flex-1 rounded border border-gray-300 p-2 text-sm" placeholder="如：帮我创建一个提现订单...">
    <button id="sendBtn" class="bg-blue-600 text-white px-4 py-2 rounded text-sm whitespace-nowrap">发送</button>
  </div>

  <!-- 使用 ESM 引入标准的 MCP 浏览器客户端 SDK -->
  <script type="module">
    const apiKeyInput = document.getElementById('apiKey');
    apiKeyInput.value = localStorage.getItem('moonshot_api_key') || '';
    apiKeyInput.addEventListener('change', (e) => localStorage.setItem('moonshot_api_key', e.target.value));

    let mcpClient;
    let availableTools = [];

    // 初始化 MCP 连接 (连接到 Node.js)
    async function initMCP() {
      try {
        // 使用动态 import 捕获加载失败的情况（例如手机没翻墙连不上 esm.sh）
        // 添加 bundle 参数来避免浏览器兼容性问题
        const { Client } = await import("https://esm.sh/@modelcontextprotocol/sdk@1.0.1/client/index.js?bundle");
        const { SSEClientTransport } = await import("https://esm.sh/@modelcontextprotocol/sdk@1.0.1/client/sse.js?bundle");

        // 动态获取当前的域名或 IP，避免连不上
        const host = window.location.host;
        const protocol = window.location.protocol;
        const transport = new SSEClientTransport(new URL(`${protocol}//${host}/sse?sessionId=${window.sessionId}`));
        mcpClient = new Client({ name: "mobile-remote", version: "1.0.0" }, { capabilities: {} });
        
        await mcpClient.connect(transport);
        document.getElementById('status').textContent = '已连接电脑';
        document.getElementById('status').className = 'text-xs bg-green-500 px-2 py-1 rounded';

        // 获取电脑端注册上来的所有工具
        const res = await mcpClient.listTools();
        availableTools = res.tools;
        addMessage(`系统`, `✅ 成功获取电脑端 ${availableTools.length} 个可用工具，随时可以下发指令！`);
      } catch (e) {
        console.error('MCP 模块加载或连接报错:', e);
        document.getElementById('status').textContent = '连接失败(可能需代理)';
        document.getElementById('status').className = 'text-xs bg-red-500 px-2 py-1 rounded';
        addMessage('系统错误', `无法连接：${e.message}。如果手机没有配置代理，可能无法加载必要的依赖模块。`);
      }
    }

    initMCP();

    const chatEl = document.getElementById('chat');
    function addMessage(sender, text) {
      const div = document.createElement('div');
      div.className = `p-3 rounded-lg ${sender === '我' ? 'bg-blue-100 ml-auto' : 'bg-white border'} max-w-[85%]`;
      div.innerHTML = `<div class="font-bold text-[10px] text-gray-500 mb-1">${sender}</div><div>${text}</div>`;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    // 核心逻辑：手机端直连 Moonshot(Kimi) API，并将大模型的 Function Calling 转成 MCP 指令发给电脑
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const msg = document.getElementById('msgInput').value;
      if (!msg) return;
      const apiKey = apiKeyInput.value;
      if (!apiKey) { alert('请先输入 Moonshot(Kimi) API Key 以驱动大模型'); return; }

      addMessage('我', msg);
      document.getElementById('msgInput').value = '';
      addMessage('系统', '🧠 正在思考...');

      try {
        const toolsForKimi = availableTools.map(t => ({
          type: "function",
          function: { name: t.name, description: t.description, parameters: t.inputSchema }
        }));

        // 维护对话上下文，以支持连续调用
        let messages = [
          { role: "system", content: "你是 Kimi，由 Moonshot AI 提供的人工智能助手，你更擅长中文和英文的对话。你会为用户提供安全，有帮助，准确的回答。同时，你会拒绝一切涉及恐怖主义，种族歧视，黄色暴力等问题的回答。Moonshot AI 为专有名词，不可翻译成其他语言。" },
          { role: "user", content: msg }
        ];

        while (true) {
          // 调用 Moonshot(Kimi) API (使用原生 fetch 请求)
          const response = await fetch('https://api.moonshot.cn/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: "kimi-k2.5",
              messages: messages,
              tools: toolsForKimi.length > 0 ? toolsForKimi : undefined,
              tool_choice: "auto"
            })
          });

          const data = await response.json();
          const message = data.choices[0].message;
          messages.push(message); // 将大模型的回复加入上下文

          // 如果大模型决定调用工具
          if (message.tool_calls && message.tool_calls.length > 0) {
            for (const tc of message.tool_calls) {
              const funcName = tc.function.name;
              const funcArgs = JSON.parse(tc.function.arguments);
              addMessage('系统', `⚡️ 正在遥控电脑执行: <b>${funcName}</b>...`);
              
              // 【最震撼的一步】：手机端通过 MCP 协议，通知云端，云端通知电脑端网页执行！
              const result = await mcpClient.callTool({ name: funcName, arguments: funcArgs });

              const resultText = result.content[0].text;
              addMessage('电脑返回', `<pre class="text-[10px] bg-gray-100 p-1 mt-1 overflow-x-auto">${resultText}</pre>`);

              // 将工具执行结果加入上下文，以便大模型继续思考
              messages.push({
                role: "tool",
                tool_call_id: tc.id,
                name: funcName,
                content: resultText
              });
            }
          } else {
            addMessage('AI', message.content || '执行完毕。');
            break; // 没有工具调用了，结束循环
          }
        }
      } catch (e) { addMessage('系统错误', e.message); }
    });
  </script>
</body>
</html>
